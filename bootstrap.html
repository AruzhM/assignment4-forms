<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Contact Form</title>

<link  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

        <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>Campus Club</h2>
    <p>Meet new people, share ideas, and join student activities.</p>
</header>
    <nav class="navbar bg-light">
        <div class="container d-flex flex-wrap gap-3">
            <a class="nav-link" href="index.html">Basic Form</a>
            <a class="nav-link" href="validation.html">HTML5 Validation</a>
            <a class="nav-link" href="bootstrap.html">Bootstrap Form</a>
            <a class="nav-link" href="feedback.html">Validation Feedback</a>
            <a class="nav-link" href="registration.html">Registration</a>
        </div>
    </nav>

    <main class="container py-5">
        <h1>Ask About the Club</h1>
 <p>Have a question before joining? Send us a message.</p>

        <form class="row g-3">
            <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input
                    type="text"
                    class="form-control"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                    minlength="2"
                    maxlength="50">
            </div>

            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="name@example.com"
                    aria-describedby="email-help"
                    required>

                <div id="email-help" class="form-text">
                    We will never share your email.
                </div>
            </div>

            <div class="col-12">
                <label for="message" class="form-label">Message</label>
                <textarea
                    class="form-control"
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Write your message"
                    required
                    minlength="10"
                    maxlength="500"></textarea>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary">
                    Submit
                </button>
            </div>
        </form>
    </main>

<footer>
    <p>© 2026 Campus Club. Created by Aruzhan.</p>
</footer>

</body>
</html>
