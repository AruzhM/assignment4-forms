<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>HTML5 Validation</title>
</head>
<body>
    <nav>
        <a href="index.html">Basic Form</a>
        <a href="validation.html">HTML5 Validation</a>
        <a href="bootstrap.html">Bootstrap Form</a>
        <a href="feedback.html">Validation Feedback</a>
        <a href="registration.html">Registration</a>
    </nav>

    <main>
        <h1>Contact Form with Validation</h1>

        <form>
    <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name"
               required minlength="2" maxlength="50">
    </div>

    <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               required>
    </div>

    <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5"
                  required minlength="10" maxlength="500"></textarea>
    </div>

    <button type="submit">Submit</button>
        </form>

    </main>
</body>
</html>
